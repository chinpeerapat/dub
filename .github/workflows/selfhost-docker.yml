name: Self-hosted Docker

on:
  push:
    branches: ["selfhost/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Generate disposable configuration
        run: node deploy/ci/configure.mjs

      - name: Build migration and test tools
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: tools
          load: true
          tags: dub-selfhost:tools
          cache-from: type=gha,scope=selfhost-tools
          cache-to: type=gha,mode=max,scope=selfhost-tools

      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          load: true
          tags: dub-selfhost:local
          cache-from: type=gha,scope=selfhost-runtime
          cache-to: type=gha,mode=max,scope=selfhost-runtime
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:8888
            NEXT_PUBLIC_API_URL=http://api.localhost:8888
            NEXT_PUBLIC_PARTNERS_URL=http://partners.localhost:8888
            NEXT_PUBLIC_ADMIN_URL=http://admin.localhost:8888
            NEXT_PUBLIC_SHORT_DOMAIN=go.localhost
            NEXT_PUBLIC_CUSTOM_DOMAIN_CNAME=go.localhost
            STORAGE_BASE_URL=http://localhost:8000/storage/v1/object/public/public

      - name: Verify fresh stack, backend integration tests, and application flows
        run: node --env-file=.env.selfhost deploy/ci/smoke.mjs

      - name: Verify browser login and workspace
        run: |
          docker run --rm --network host -e CI=true dub-selfhost:tools sh -c '
            set -eu
            cd /app/apps/web
            pnpm exec playwright install --with-deps chromium
            pnpm exec playwright test --config=/app/deploy/ci/browser.config.cjs
          '

      - name: Container diagnostics
        if: failure()
        run: |
          docker compose -f compose.yml -f deploy/ci/compose.yml --env-file .env.selfhost ps -a
          docker compose -f compose.yml -f deploy/ci/compose.yml --env-file .env.selfhost logs --no-color --tail=150
          df -h
          free -h

      - name: Stop disposable stack
        if: always()
        run: docker compose -f compose.yml -f deploy/ci/compose.yml --env-file .env.selfhost down --volumes
