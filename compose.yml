name: dub-selfhost
include:
  - path: deploy/supabase/compose.yml
services:
  migrate:
    build:
      context: .
      target: tools
    env_file: .env.selfhost
    command: ["node", "apps/web/.deployment/init.cjs"]
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: "no"
  web:
    build:
      context: .
      target: runtime
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PARTNERS_URL: ${NEXT_PUBLIC_PARTNERS_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
        NEXT_PUBLIC_SHORT_DOMAIN: ${NEXT_PUBLIC_SHORT_DOMAIN}
        NEXT_PUBLIC_CUSTOM_DOMAIN_CNAME: ${NEXT_PUBLIC_CUSTOM_DOMAIN_CNAME}
        NEXT_PUBLIC_CUSTOM_DOMAIN_A_RECORD: ${NEXT_PUBLIC_CUSTOM_DOMAIN_A_RECORD}
        STORAGE_BASE_URL: ${STORAGE_BASE_URL}
    image: dub-selfhost:local
    env_file: .env.selfhost
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      ADMIN_DATABASE_URL: ""
      POSTGRES_PASSWORD: ""
      DATABASE_APP_PASSWORD: ""
      JWT_SECRET: ""
    ports:
      - "127.0.0.1:8888:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
    stop_grace_period: 45s
  worker:
    image: dub-selfhost:local
    env_file: .env.selfhost
    environment:
      NODE_ENV: production
      ADMIN_DATABASE_URL: ""
      POSTGRES_PASSWORD: ""
      DATABASE_APP_PASSWORD: ""
      JWT_SECRET: ""
    command: ["node", "apps/web/.deployment/worker.cjs"]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 11m
    healthcheck:
      test: ["CMD", "node", "apps/web/.deployment/worker.cjs", "--health"]
      interval: 30s
      timeout: 10s
  gateway:
    image: caddy:2.10.2-alpine
    env_file: .env.selfhost
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "127.0.0.1:8000:8000"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
